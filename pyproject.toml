[project]
name = "controllai"
version = "2.2.1"
description = "Enterprise-BI-Copilot für Profitabilität, Strategie und Prozesse"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sherwan Shweish" }]
# Agenten-Standard v1: eine Quelle für Abhängigkeiten (uv); requirements.txt bleibt für pip-Nutzer synchron.
dependencies = [
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "anthropic>=0.60",
    "google-genai>=1.20",
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlglot>=26,<31",
    "pdfplumber>=0.11",
    "plotly>=5.22",
    "streamlit>=1.50",
    "altair>=5.4",
    "pyarrow>=16",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "python-pptx>=1.0",
    "reportlab>=4.2",
    "openpyxl>=3.1",
    "pywebview>=5.3; sys_platform == 'darwin'",   # Desktop-Fenster (macOS, WKWebView)
    "xlsxwriter>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
package = false          # Anwendung, kein Bibliothekspaket – uv installiert nur die Abhängigkeiten

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "invariante: mathematische Invariante (Summen, Additivität, Reproduzierbarkeit)",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "I"]
